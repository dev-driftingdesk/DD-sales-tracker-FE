notes: |
  This PRB addresses the core requirement for pure backend API authentication by completely removing
  the hybrid authentication system that was interfering with session persistence.
  
  **Critical Changes:**
  1. Complete removal of all mock authentication infrastructure
  2. Elimination of fallback logic that caused authentication source confusion
  3. Simplification to pure backend API authentication paths only
  4. Streamlined session management using only real JWT tokens
  
  **Expected Outcome:**
  - Reliable session persistence using backend API validation
  - No confusion between mock and real authentication sources
  - Simplified debugging and maintenance
  - Production-ready authentication system without development scaffolding
  
  **Backend Requirement:**
  - Backend server must be running on localhost:5555
  - Backend must implement standard authentication endpoints:
    - POST /api/v1/auth/login
    - GET /api/v1/auth/profile  
    - POST /api/v1/auth/refresh
    - POST /api/v1/auth/logout

