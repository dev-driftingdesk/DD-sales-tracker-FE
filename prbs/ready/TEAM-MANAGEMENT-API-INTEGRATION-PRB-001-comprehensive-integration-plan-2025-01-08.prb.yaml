## API Specification Analysis

### Core Endpoints (from API_REQUIREMENTS_SPECIFICATION.md Section 8)

**8.1 GET /teams** - Comprehensive team retrieval with member details
- Response includes: teams[], summary metrics, performance data
- Complex nested data: members[], targets, territories, performance metrics
- Requires mapping to current store structure

**8.2 POST /teams** - Team creation with initial members (admin only)
- Request validation for team data structure
- Member assignment during creation
- Permission-based access control

**8.3 PUT /teams/{id}** - Team updates and membership management (admin/manager)
- Support for partial updates
- Member addition/removal operations
- Territory and target updates

**8.4 GET /teams/{id}/performance** - Detailed team performance metrics
- Complex performance calculations
- Historical data and trends
- Member-level performance breakdown

### Data Mapping Requirements

**Frontend Store Structure → API Schema Mapping**:
- Store users[] → API teams[].members[] with expanded user data
- Store teams[] → API teams[] with additional metadata
- Store invitations[] → Likely separate invitation endpoints (not in current spec)
- Store permissions → API members[].role and permission system
- Store bulk operations → Multiple API calls or bulk endpoint creation

